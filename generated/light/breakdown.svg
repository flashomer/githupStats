<svg width="435" height="235" viewBox="0 0 435 235" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution Mix" color="#24292f">
  <title>Contribution Mix</title>
  <style>
    .heading { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #1a7f5a; }
    .stat { font: 600 25px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #24292f; }
    .stat-sm { font: 600 18px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #24292f; }
    .caption {
      font: 500 10px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif;
      fill: #24292f;
      fill-opacity: 0.55;
      letter-spacing: 0.08em;
    }
    .tile-value { font: 600 20px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #24292f; }
    .rank { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #1a7f5a; }
    .row { font: 600 11px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #24292f; }
    .row-dim { font: 500 10px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #24292f; fill-opacity: 0.55; }
    .badge { font: 600 11px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #1a7f5a; letter-spacing: 0.08em; }
    .icon { fill: #41b883; fill-opacity: 0.85; }
  
    @media (prefers-reduced-motion: no-preference) {
      .rise, .fade, .pop { opacity: 0; }
      .rise { animation: rise 0.55s ease-out forwards; }
      .fade { animation: fade 0.5s ease-out forwards; }
      .pop {
        transform-box: fill-box;
        transform-origin: center;
        animation: pop 0.6s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
      }
      .grow {
        transform-box: fill-box;
        transform-origin: left center;
        animation: grow 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .ring { animation: ring 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
      .sweep { animation: sweep 1.15s cubic-bezier(0.32, 0.9, 0.4, 1); }
      @keyframes sweep { from { stroke-dashoffset: var(--dash); } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes rise {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pop {
        from { opacity: 0; transform: scale(0.86); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes grow { from { transform: scaleX(0); } }
      @keyframes ring { from { stroke-dashoffset: var(--dash); } }
    }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="434" height="234" fill="#ffffff" stroke="#e3e8ee"/>
  <text class="heading" x="24" y="34">Contribution Mix</text>
  <g transform="translate(334.2, 24) scale(0.6875)"><path class="icon" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 0 1 1-1ZM5 12.25v3.25a.25.25 0 0 0 .4.2l1.45-1.087a.25.25 0 0 1 .3 0L8.6 15.7a.25.25 0 0 0 .4-.2v-3.25a.25.25 0 0 0-.25-.25h-3.5a.25.25 0 0 0-.25.25Z"/></g><text class="badge" x="411" y="34" text-anchor="end">ALL TIME</text>
  <line x1="24" y1="52" x2="411" y2="52" stroke="#e3e8ee"/>
  
    
    <mask id="mix-sweep">
      <circle class="sweep" style="--dash:282.74"
        cx="98" cy="142" r="45" fill="none" stroke="white"
        stroke-width="18"
        stroke-dasharray="282.74" stroke-dashoffset="0"
        transform="rotate(-90 98 142)"/>
    </mask>
    <g mask="url(#mix-sweep)"><path d="M 98.00 88.00 A 54 54 0 1 1 57.94 105.79 L 71.29 117.86 A 36 36 0 1 0 98.00 106.00 Z" fill="#3fb950" stroke="#ffffff" stroke-width="1.5"/><path d="M 57.94 105.79 A 54 54 0 0 1 93.91 88.15 L 95.28 106.10 A 36 36 0 0 0 71.29 117.86 Z" fill="#58a6ff" stroke="#ffffff" stroke-width="1.5"/><path d="M 93.91 88.15 A 54 54 0 0 1 98.00 88.00 L 98.00 106.00 A 36 36 0 0 0 95.28 106.10 Z" fill="#d29922" stroke="#ffffff" stroke-width="1.5"/></g>
    <g class="fade" style="animation-delay:700ms"><text class="stat-sm" x="98" y="143" text-anchor="middle">2.3k</text>
       <text class="row-dim" x="98" y="158" text-anchor="middle">total</text></g>
    <g class="rise">
      <g transform="translate(184, 106)">
        <rect x="0" y="-7" width="8" height="8" rx="2" fill="#3fb950"/>
        <text class="row" x="16" y="0">Commits</text>
        <text class="row-dim" x="227" y="0" text-anchor="end">86.7%</text>
        <text class="row-dim" x="16" y="14">2k</text>
      </g></g><g class="rise" style="animation-delay:997ms">
      <g transform="translate(184, 140)">
        <rect x="0" y="-7" width="8" height="8" rx="2" fill="#58a6ff"/>
        <text class="row" x="16" y="0">Pull requests</text>
        <text class="row-dim" x="227" y="0" text-anchor="end">12.1%</text>
        <text class="row-dim" x="16" y="14">281</text>
      </g></g><g class="rise" style="animation-delay:1136ms">
      <g transform="translate(184, 174)">
        <rect x="0" y="-7" width="8" height="8" rx="2" fill="#d29922"/>
        <text class="row" x="16" y="0">Issues</text>
        <text class="row-dim" x="227" y="0" text-anchor="end">1.2%</text>
        <text class="row-dim" x="16" y="14">28</text>
      </g></g>
</svg>
