<svg width="435" height="235" viewBox="0 0 435 235" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contributions" color="#c9d1d9">
  <title>Contributions</title>
  <style>
    .heading { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #41b883; }
    .stat { font: 600 25px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #c9d1d9; }
    .stat-sm { font: 600 18px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #c9d1d9; }
    .caption {
      font: 500 10px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif;
      fill: #c9d1d9;
      fill-opacity: 0.55;
      letter-spacing: 0.08em;
    }
    .tile-value { font: 600 20px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #c9d1d9; }
    .rank { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #41b883; }
    .row { font: 600 11px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #c9d1d9; }
    .row-dim { font: 500 10px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #c9d1d9; fill-opacity: 0.55; }
    .badge { font: 600 11px 'Segoe UI', Ubuntu, -apple-system, Helvetica, sans-serif; fill: #41b883; letter-spacing: 0.08em; }
    .icon { fill: #41b883; fill-opacity: 0.85; }
  
    @media (prefers-reduced-motion: no-preference) {
      .rise, .fade, .pop { opacity: 0; }
      .rise { animation: rise 0.55s ease-out forwards; }
      .fade { animation: fade 0.5s ease-out forwards; }
      .pop {
        transform-box: fill-box;
        transform-origin: center;
        animation: pop 0.6s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
      }
      .grow {
        transform-box: fill-box;
        transform-origin: left center;
        animation: grow 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .ring { animation: ring 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
      .sweep { animation: sweep 1.15s cubic-bezier(0.32, 0.9, 0.4, 1); }
      @keyframes sweep { from { stroke-dashoffset: var(--dash); } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes rise {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pop {
        from { opacity: 0; transform: scale(0.86); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes grow { from { transform: scaleX(0); } }
      @keyframes ring { from { stroke-dashoffset: var(--dash); } }
    }
  </style>
