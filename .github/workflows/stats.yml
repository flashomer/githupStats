name: Generate stats cards

on:
  schedule:
    # Hourly, though GitHub tends to delay scheduled runs.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # github.token can't read user-level data, so a classic PAT is required.
      - name: Generate cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "STATS_TOKEN secret is missing."
            exit 1
          fi
          node scripts/generate.js

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh stats cards"
            git push
          fi
